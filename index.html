<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Granites | Luxury Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f1115; }
        .lux-font { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-gradient { color: transparent; background: linear-gradient(to right, #d4af37, #f7ef8a); -webkit-background-clip: text; }
        .gold-border { border-color: #d4af37; }
    </style>
</head>
<body class="text-slate-200">

    <!-- Header Section -->
    <nav class="max-w-7xl mx-auto px-6 py-10 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-4">
            <img src="logo.png" alt="Infinity Logo" class="h-12 w-12 object-contain">
            <div>
                <h1 class="lux-font text-3xl font-bold tracking-wide text-white">INFINITY GRANITES</h1>
                <p class="text-xs uppercase tracking-[0.2em] text-[#d4af37]">Turn Dreams Into Reality</p>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-20">
        <header class="mb-20 text-center">
            <h2 class="lux-font text-5xl md:text-6xl text-white mb-6">Exquisite Stone Collection</h2>
            <div class="w-24 h-1 bg-[#d4af37] mx-auto mb-6"></div>
            <p class="text-slate-400 max-w-2xl mx-auto font-light">Experience the pinnacle of luxury with our curated selection of premium granites. Each piece is crafted to redefine your spaces.</p>
        </header>

        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Cards will be injected -->
        </div>
    </main>

    <script>
        const data = [
            { name: "Markino Black Polish", price: "52", img: "mar.jpeg" },
            { name: "Markino Lappatro", price: "62", img: "mark.jpeg" },
            { name: "Baghera Black / Brown Polish", price: "47", img: "bpp.jpeg" },
            { name: "Baghera Lappatro", price: "57", img: "bag.jpeg" },
            { name: "Pearl Black Polish", price: "52", img: "pea.jpeg" },
            { name: "Pearl Black Lappatro", price: "60", img: "pbl.jpeg" },
            { name: "Kotada Black Polish", price: "48", img: "kbp.jpeg" },
            { name: "Kotada Black Lappatro", price: "58", img: "maj.jpeg" },
            { name: "Fish Black", price: "55", img: "fis.jpeg" },
            { name: "Rajasthan Blue Dot", price: "70", img: "rbt.jpeg" },
            { name: "Ice White Polish", price: "50", img: "ice.jpeg" },
            { name: "Ice White Lappatro", price: "60", img: "ice.jpeg" },
            { name: "P. White Polish", price: "48", img: "pwh.jpeg" },
            { name: "P. White Lappatro", price: "58", img: "pwh.jpeg" },
            { name: "Rajasthan Z Black", price: "70", img: "raj.jpeg" },
            { name: "Chima Pink", price: "54", img: "chi.jpeg" },
            { name: "White Forest Polish", price: "48", img: "bij.jpeg" },
            { name: "White Forest Lappatro", price: "58", img: "bij.jpeg" },
            { name: "Paradiso Brown", price: "48", img: "par.jpeg" },
            { name: "Himalayan Brown", price: "50", img: "him.jpeg" },
            { name: "Coin Black Lappatro", price: "70", img: "coi.jpeg" },
            { name: "Matka Brown", price: "68", img: "mat.jpeg" },
            { name: "Tiger Skin", price: "45", img: "tig.jpeg" },
            { name: "Asian Black", price: "45", img: "asi.jpeg" },
            { name: "Jam Red", price: "120", img: "jam.jpeg" }
        ];

        const grid = document.getElementById('grid');
        data.forEach(item => {
            grid.innerHTML += `
                <div class="glass-card group rounded-none p-4 transition-all hover:scale-[1.02] duration-500">
                    <div class="overflow-hidden mb-6 h-80">
                        <img src="${item.img}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700">
                    </div>
                    <h3 class="lux-font text-2xl text-white mb-2">${item.name}</h3>
                    <div class="flex justify-between items-center">
                        <span class="gold-gradient font-bold text-xl">₹${item.price} <span class="text-sm font-light text-slate-500">/ sq.ft</span></span>
                        <button class="border border-[#d4af37] text-[#d4af37] px-6 py-2 text-xs uppercase tracking-widest hover:bg-[#d4af37] hover:text-black transition-all">Select</button>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
